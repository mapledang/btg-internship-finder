name: Scan for internships

on:
  schedule:
    - cron: "17 */2 * * *"     # scan every 2 hours (UTC)
    - cron: "3 16,17 * * *"    # ~9:03 AM Pacific (16:03 UTC in summer, 17:03 UTC in winter) for the daily digest
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = scan + daily digest when due · digest-now = scan + post digest now · test = sample digest (saves nothing)"
        type: choice
        default: normal
        options: [normal, digest-now, test]

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan job boards and post to Slack
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            python scan.py --test-post 2
          elif [ "${{ inputs.mode }}" = "digest-now" ]; then
            python scan.py --digest-now
          else
            python scan.py
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TECH: ${{ secrets.SLACK_WEBHOOK_TECH }}
          SLACK_WEBHOOK_BUSINESS: ${{ secrets.SLACK_WEBHOOK_BUSINESS }}

      - name: Save list of already-posted jobs
        if: always() && inputs.mode != 'test'
        run: |
          git config user.name "internship-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen jobs"
            git pull --rebase --autostash
            git push
          fi
