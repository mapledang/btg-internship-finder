# ---------------------------------------------------------------------------
# Internship finder settings. Edit and commit; the next scheduled run uses them.
# ---------------------------------------------------------------------------

# Words that make a job title count as an internship (case-insensitive, whole words).
include_title_patterns:
  - intern
  - interns
  - internship
  - internships
  - co-op
  - coop
  - summer analyst
  - summer scholar
  - summer program
  - student researcher
  - apprentice
  # freshman / sophomore programs (often not called "internships")
  - sophomore
  - sophomores
  - freshman
  - freshmen
  - early insight
  - early insights
  - insight program
  - insight week
  - discovery program
  - explore program
  - spring week

# Titles containing any of these are skipped. Includes MBA / grad-school roles,
# since this channel is for undergrads.
exclude_title_patterns:
  # grad school & MBA
  - mba
  - summer associate      # at banks & consulting firms this means MBA students
  - master
  - masters
  - phd
  - ph.d
  - doctoral
  - doctorate
  - postdoc
  - graduate
  - grad
  - postgraduate
  - post-graduate
  - msc
  - m.s.
  - ms student
  - mba candidate
  - pharmd
  - residency
  - law clerk
  - law school
  - jd
  - 1l
  - 2l
  # staff roles that mention interns
  - program manager
  - coordinator
  - recruiter
  - recruiting
  - talent acquisition
  - director
  # medical / clinical
  - medical intern
  - pharmacy intern
  - dietetic
  - clinical
  - nurse

# Graduation years you care about. Jobs whose description names only other grad years
# are skipped; jobs that don't say are kept. Each post shows the grad year it asks for.
target_grad_years: [2027, 2028, 2029]

# Summer internships only. Fall / winter / spring internships and co-ops without
# summer dates are skipped. Set to true to include them (each post is labeled).
include_off_season: false

# ---------------------------------------------------------------------------
# Daily digest: new roles are collected all day (scans run every 2 hours) and posted
# once a day as a single Slack message with up to `per_section` roles per section.
# Biggest companies (Fortune 100 / big tech) and newest roles are picked first. Roles that don't make the
# cut stay queued for the next day, for up to `keep_days`.
digest:
  time: "09:00"                    # first scan at/after this time posts the digest
  timezone: America/Los_Angeles
  per_section: 5                   # default when a section has no `limit`
  keep_days: 7
  # Company size: only Tier 1 (Fortune 100, big tech, MBB, Big 4) and Tier 2 (other large,
  # well-known companies) by default; see data/company_tiers.yaml. Set max_company_tier: 3
  # or fill_with_smaller_companies: true to also include smaller companies (listed after big ones).
  max_company_tier: 2
  fill_with_smaller_companies: false
  sections:
    # Main section: 15 business / strategy / consulting roles. Tech companies are listed
    # first, then other big companies.
    - name: "Business, Strategy & Consulting"
      categories: [consulting, business]
      limit: 15
      prefer_tech: true
    # A short section for everything else. Set limit: 0 to remove it.
    - name: "Other Notable Roles"
      categories: [product, finance, data, marketing]
      underclass: true             # freshman / sophomore programs go here
      limit: 5
      show_category: true          # label each role (Product, Finance, ...)

# Role categories to look at. Each section above draws from these.
# Others available: business (ops, sales, supply chain), it, engineering.
post_categories: [consulting, business, product, finance, data, marketing]

# Role categories that must come from tech companies (see data/company_tiers.yaml).
# Empty = any big company; the main section still lists tech companies first.
tech_companies_only_for: []

# Engineering roles (software, ML, hardware...) are only used from these companies,
# and only if you add "engineering" to post_categories and a digest section.
engineering_companies:
  - Google
  - Meta
  - Apple
  - Amazon
  - Microsoft
  - Netflix
  - NVIDIA
  - Salesforce
  - Adobe
  - Stripe
  - Airbnb
  - Uber
  - LinkedIn
  - Palantir
  - Databricks
  - Bloomberg
  - Goldman Sachs
  - JPMorgan Chase
  - Morgan Stanley
  - Capital One
  - Citadel
  - Jane Street
  - Two Sigma
  - Hudson River Trading
  - Tesla
  - SpaceX
  - Intuit
  - Visa
  - Mastercard
  - American Express
  - PayPal
  - Spotify
  - The Walt Disney Company

# Only post US / remote roles. Jobs whose location clearly names another country are
# skipped; anything ambiguous is kept so nothing real gets dropped.
us_only: true

# At most this many new roles are checked (descriptions read) per run. Extras wait for the next run.
max_posts_per_run: 120

# Include the community-maintained Simplify internship feed (covers Google, Meta,
# Apple, Amazon, Microsoft and others whose careers sites can't be scanned directly).
use_simplify_feed: true

# Stop scanning company boards after this many minutes and post what was found.
# Boards that didn't finish are simply tried again next run.
max_scan_minutes: 15
