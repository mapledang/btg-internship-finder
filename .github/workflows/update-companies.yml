name: Update company list

on:
  schedule:
    - cron: "41 9 1 * *"       # monthly, 1st of the month
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan                  # never run at the same time as a scan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh top companies from Simplify listings
        run: python tools/build_companies.py --top 1000

      - name: Look up business companies from data/business_seed.txt
        run: python tools/discover.py

      - name: Show report
        run: cat data/discover_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name "internship-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/companies.json data/companies_discovered.json data/discover_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Update company list"
            git pull --rebase --autostash
            git push
          fi
