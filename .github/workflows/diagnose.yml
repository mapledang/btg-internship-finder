name: Diagnose (temporary)

on:
  push:
    paths: [tools/diagnose.py]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/diagnose.py
      - name: Save results
        run: |
          git config user.name "internship-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnose.txt
          git commit -m "Diagnostic results" || exit 0
          git pull --rebase --autostash
          git push
