# Company tiers and tech labels. Edit freely; names are matched loosely
# (case, punctuation, "Inc"/"The"/"Company" don't matter, but spelling does).
#
# tier1: Fortune 100, big tech, MBB, Big 4. Scanned first, posted first, marked ⭐ in Slack.
# tier2: other large / well-known companies. Scanned and posted next.
# Everyone else is tier 3.
#
# tech: tech companies. Business / strategy / product / consulting / marketing roles are
# only posted from these (see config.yaml: tech_companies_only_for). Companies NOT listed
# here still count as tech if they hire through Greenhouse, Lever or Ashby (almost always
# startups) or have "AI", "Software", "Labs", "Robotics"... in their name. To mark one of
# those as NOT tech, add it under not_tech.

